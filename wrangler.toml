# For God so loved the world, that He gave His only begotten Son,
# that all who believe in Him should not perish but have everlasting life. — John 3:16

name = "bible-systems-chirho"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
account_id = "aecd5616f7ef88323e52b6406ba384bd"

# Production routes. The apex is a custom domain. www.bible.systems is a proxied CNAME to the apex
# that reaches this Worker through the zone route; src/hooks.server.ts redirects it to the apex.
# `wrangler deploy` replaces the Worker's routes with this list, so keep both.
routes = [
  { pattern = "bible.systems", custom_domain = true },
  { pattern = "www.bible.systems/*", zone_name = "bible.systems" }
]
# Serve only on those hosts: no *.workers.dev URL and no per-version preview URLs.
workers_dev = false
preview_urls = false

# Static assets: the client build. @sveltejs/adapter-cloudflare writes main (_worker.js) here and an
# .assetsignore that keeps it from being served; wrangler bundles main at deploy.
[assets]
binding = "ASSETS_CHIRHO"
directory = ".svelte-kit/cloudflare"

[vars]
ENVIRONMENT = "development"

# Secrets (set via `wrangler secret put TURNSTILE_SECRET_KEY_CHIRHO`)
# TURNSTILE_SECRET_KEY_CHIRHO - Cloudflare Turnstile secret key for verification

[build]
command = "bun run build"

[dev]
port = 5180
local_protocol = "http"

# D1 Databases
[[d1_databases]]
binding = "FEEDBACK_DB_CHIRHO"
database_name = "feedback-db-chirho"
database_id = "c7a9c2a1-b5f9-4a30-86b3-85196427e294"

[[d1_databases]]
binding = "CATALOG_DB_CHIRHO"
database_name = "catalog-chirho"
