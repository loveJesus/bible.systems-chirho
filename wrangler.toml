# For God so loved the world, that He gave His only begotten Son,
# that all who believe in Him should not perish but have everlasting life. — John 3:16

name = "bible-systems-chirho"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
account_id = "aecd5616f7ef88323e52b6406ba384bd"

# Production route
routes = [{ pattern = "bible.systems", custom_domain = true }]

# Static assets configuration
[assets]
directory = ".svelte-kit/cloudflare"

[vars]
ENVIRONMENT = "development"

# Secrets (set via `wrangler secret put TURNSTILE_SECRET_KEY_CHIRHO`)
# TURNSTILE_SECRET_KEY_CHIRHO - Cloudflare Turnstile secret key for verification

[build]
command = "bun run build"

[dev]
port = 5180
local_protocol = "http"
